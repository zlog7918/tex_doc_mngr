services:
  psql:
    build:
      context: ./psql
      dockerfile: Dockerfile
    volumes:
      # - ./psql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - psql_data:/var/lib/postgresql/data/db-files:rw
    env_file:
      - ./.psql.env
    environment:
      - PGDATA=/var/lib/postgresql/data/db-files/
    expose:
      - 5432
    depends_on:
      - psql_base
  psql_base:
    build:
      context: ./psql/base
      dockerfile: Dockerfile
    command: ["echo", "\"tdm-psql_base:latest EXIT\""]
volumes:
  psql_data:
