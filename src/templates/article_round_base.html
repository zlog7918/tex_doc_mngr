<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ article.title }}</title>
    <style>
        .tab {
            display: inline-block;
            margin-right: 5px;
            padding: 10px;
            background-color: #ddd;
            cursor: pointer;
        }
        .tab.active {
            background-color: #aaa;
        }
        .tab-content {
            margin-top: 20px;
            border: 1px solid #ccc;
            padding: 10px;
        }
        .hidden {
            display: none;
        }

        button {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>{{ article.title }}</h1>
    <p><strong>Author:</strong> {{ article.author.nick }}</p>
    <div id="tabs">
        {% for round in article.rounds %}
            <div class="tab {% if loop.last %}active{% endif %}" 
                 data-index="{{ loop.index0 }}" 
                 data-url="{{ round.article_url }}"
                 data-last="{% if loop.last %}true{% else %}false{% endif %}"
                 onclick="showTab(this)">
                Round {{ round.round_number }}
            </div>
        {% endfor %}
    </div>
    <div class="tab-content" id="tab-content">
        {{ tab_content|safe }}
    </div>
    <div id="old-round-content" class="tab-content hidden">
        <p>To jest stara wersja artykułu. Aby zobaczyć pełną treść, przejdź do najnowszej rundy.</p>
    </div>

    <script>
        let loadedArticles = {};

        function showTab(tabElement) {
            let url = tabElement.getAttribute('data-url');
            let isLastRound = tabElement.getAttribute('data-last') === 'true';

            // Zmiana aktywnej zakładki
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            tabElement.classList.add('active');

            // Pokaż odpowiednią zawartość
            if (isLastRound) {
                document.getElementById('tab-content').classList.remove('hidden');
                document.getElementById('old-round-content').classList.add('hidden');
            } else {
                document.getElementById('tab-content').classList.add('hidden');
                document.getElementById('old-round-content').classList.remove('hidden');
            }
        }

        // Automatyczne wczytanie ostatniej rundy na starcie
        window.onload = function () {
            let lastTab = document.querySelector('.tab.active');
            if (lastTab) {
                showTab(lastTab);
            }
        };
    </script>
</body>
</html>
