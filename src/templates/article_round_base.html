<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ article.title }}</title>
    <style>
        .tab {
            display: inline-block;
            margin-right: 5px;
            padding: 10px;
            background-color: #ddd;
            cursor: pointer;
        }
        .tab.active {
            background-color: #aaa;
        }
        .tab-content {
            margin-top: 20px;
            border: 1px solid #ccc;
            padding: 10px;
        }
        button {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>{{ article.title }}</h1>
    <p><strong>Author:</strong> {{ article.author }}</p>
    <div id="tabs">
        {% for round in article.rounds %}
            <div class="tab {% if loop.last %}active{% endif %}" data-index="{{ loop.index }}" onclick="showTab(this.getAttribute('data-index'))">
                Round {{ round.id }}
            </div>
        {% endfor %}
    </div>
    <div class="tab-content" id="tab-content">
        {{ tab_content|safe }}
    </div>
    <button id="add-round" onclick="addRound()">
        Add Round
    </button>
    <button id="reject" onclick="rejectArticle()">Reject</button>

    <script>
        function showTab(index) {
            // Zmiana aktywnej zakładki
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelector(`.tab:nth-child(${index})`).classList.add('active');

            // Pobieranie danych dla odpowiedniej rundy
            const rounds = {{ article.rounds|tojson }};
            const selectedRound = rounds[index - 1];
            document.getElementById('tab-content').innerHTML = `
                <p>Reviews for Round ${selectedRound.id}:</p>
                <ul>${selectedRound.reviews.map(r => `<li>${r}</li>`).join('')}</ul>
            `;

            const addRoundButton = document.getElementById('add-round');
            if (index === rounds.length) {
                addRoundButton.style.display = 'inline-block';
            } else {
                addRoundButton.style.display = 'none';
            }
        }

        function addRound() {
            fetch(`/editor/articles/{{ article.id }}/add_round`, { method: "POST" })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        location.reload();
                    } else {
                        alert("Unable to add a new round.");
                    }
                });
        }

        function rejectArticle() {
            fetch(`/editor/articles/{{ article.id }}/reject`, { method: "POST" })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert("Article has been rejected.");
                        location.reload();
                    } else {
                        alert("Unable to reject the article.");
                    }
                });
        }
    </script>
</body>
</html>
