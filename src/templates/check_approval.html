{% extends "base.html" %}

{% block body %}
<div class="container">
    <div class="confirmation-box">
        <h2>Potwierdzenie konta</h2>
        <p>Cześć, dziękujemy za założenie konta! Proszę potwierdzić swoje konto kodem wysłanym na Twój e-mail.</p>
        
        <hr>

        <form id="logout-form">
            <button type="button" id="logout-btn" class="primary-btn">Wyloguj</button>
        </form>
    </div>
</div>

<style>
    /* Globalne ustawienia */
body {
    font-family: 'Poppins', sans-serif;
    background: #f9f9f9;
    margin: 0;
    padding: 0;
}

/* Układ kontenera */
.container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    padding: 20px;
}

/* Box potwierdzenia konta */
.confirmation-box {
    background: white;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.1);
    width: 400px;
    text-align: center;
}

/* Nagłówek */
.confirmation-box h2 {
    font-size: 32px;
    font-weight: 700;
    color: #2d1053;
    margin-bottom: 15px;
    margin-top: 0;
}

/* Tekst */
.confirmation-box p {
    font-size: 18px;
    color: #333;
    margin-bottom: 20px;
    line-height: 1.4;
}

/* Przyciski */
button {
    width: 90%;
    padding: 12px;
    border-radius: 5px;
    border: none;
    font-size: 16px;
    cursor: pointer;
    font-weight: 600;
}

/* Główne przyciski akcji */
.primary-btn {
    background: #2d1053;
    color: white;
    transition: 0.3s;
}

.primary-btn:hover {
    background: #1f083c;
}

/* Linia oddzielająca */
hr {
    margin: 20px 0;
    border: none;
    height: 1px;
    background: #ddd;
}
</style>

<script>
    document.getElementById("logout-btn").addEventListener("click", function () {
        ajax_json_call('/user/logout').then(data => {
            if (data['success'])
                window.location.reload();
            else
                alert(`Err: ${data['message']}`);
        }).catch(err => alert(`Err: ${JSON.stringify(err)}`));
    });
</script>
{% endblock %}
