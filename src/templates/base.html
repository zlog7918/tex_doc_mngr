<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %} TDM {% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <script src="{{ url_for('static', filename='js/funcs.js') }}"></script>
    <style>
        html, body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #f9f9f9;
        }

        .navbar {
            background: #5a3d90;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 11px 20px;
            font-size: 18px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .navbar .logo {
            text-decoration: none;
            color: white;
            font-size: 22px;
        }

        .menu {
            display: flex;
            align-items: center;
        }

        .settings, .user-settings {
            cursor: pointer;
            font-size: 18px;
            position: relative;
            display: flex;
            align-items: center;
            margin-left: 20px;
        }

        .dropdown {
            display: none;
            position: absolute;
            right: 0;
            top: 40px;
            background: white;
            border-radius: 8px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.15);
            width: 160px;
            padding: 10px;
            z-index: 10;
        }

        .dropdown a, .dropdown button {
            display: block;
            padding: 10px;
            text-decoration: none;
            color: #333;
            font-size: 16px;
            background: none;
            border: none;
            text-align: left;
            width: 100%;
            cursor: pointer;
            border-radius: 5px;
        }

        .dropdown a:hover, .dropdown button:hover {
            background: #ece7f7;
        }

        .container {
            flex-grow: 1;
            padding: 20px;
            overflow: auto;
        }

        /* MODAL STYLES */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 10px;
            width: 350px;
            text-align: center;
            position: relative;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.2);
        }

        .modal h2 {
            margin-top: 0;
            font-size: 22px;
            color: #5a3d90;
        }

        .modal input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        .modal button {
            background: #5a3d90;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            width: 90%;
            margin-top: 10px;
        }

        .modal button:hover {
            background: #4b2f78;
        }

        .close {
            position: absolute;
            top: 10px;
            right: 15px;
            cursor: pointer;
            font-size: 22px;
            color: #777;
        }

        .close:hover {
            color: black;
        }

        .user-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: white;
            color: #5a3d90;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
        }


        .user-nick {
            font-weight: bold;
            padding: 8px 10px;
            font-size: 16px;
            color: #5a3d90;
            cursor: default;
        }
        .dropdown hr {
            margin: 5px 0;
            border: none;
            border-top: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="/" class="logo">(La)TeX Document Manager</a>
        <div class="menu">
            <div class="settings">
                PL | EN
                <div class="dropdown">
                    <a href="#">Polski</a>
                    <a href="#">English</a>
                </div>
            </div>

            {% if current_user.is_authenticated %}
            <div class="user-settings">
                <div class="user-icon">{{ current_user.get_nick()[0]|upper }}</div>
                <div class="dropdown">
                    <div class="user-nick">{{ current_user.get_nick() }}</div>
                    <hr>
                    <button id="toggle-change-password">Zmień hasło</button>
                    <button id="logout-btn">Wyloguj</button>
                </div>
            </div>            
            {% endif %}
        </div>
    </div>

    <div class="container">
        {% block body %} {% endblock %}
    </div>

    <!-- MODAL: Zmiana hasła -->
    <div id="change-password-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Zmień hasło</h2>
            <form id="change-password-form">
                <input type="password" name="passwd" placeholder="Stare hasło" required>
                <input type="password" name="new_passwd" placeholder="Nowe hasło" required>
                <input type="password" name="rep_passwd" placeholder="Powtórz nowe hasło" required>
                <button type="button" id="change-password-btn">Zmień</button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const modal = document.getElementById("change-password-modal");
            const toggleModalBtn = document.getElementById("toggle-change-password");
            const closeModalBtn = document.querySelector(".close");
            const form = document.getElementById("change-password-form");

            const dropdowns = document.querySelectorAll(".dropdown");
            const userSettings = document.querySelector(".user-settings");
            const settings = document.querySelector(".settings");

            function toggleDropdown(dropdown) {
                dropdowns.forEach(d => {
                    if (d !== dropdown) d.style.display = "none";
                });
                dropdown.style.display = (dropdown.style.display === "block") ? "none" : "block";
            }

            userSettings.addEventListener("click", function (event) {
                toggleDropdown(userSettings.querySelector(".dropdown"));
                event.stopPropagation();
            });

            settings.addEventListener("click", function (event) {
                toggleDropdown(settings.querySelector(".dropdown"));
                event.stopPropagation();
            });

            document.addEventListener("click", function () {
                dropdowns.forEach(d => d.style.display = "none");
            });

            document.getElementById("logout-btn").addEventListener("click", function () {
                ajax_json_call('/user/logout').then(data => {
                    if (data && data.error) {
                        alert(`Błąd: ${data.message || "Nieznany błąd"}`);
                    } else {
                        window.location.href = "/";
                    }
                }).catch(err => {
                    window.location.href = "/";  
                });
            });

            toggleModalBtn.addEventListener("click", function () {
                modal.style.display = "flex";
            });

            closeModalBtn.addEventListener("click", function () {
                modal.style.display = "none";
            });

            document.getElementById("change-password-btn").addEventListener("click", function () {
                ajax_json_call('{{ url_with_lang_for("user.ch_pass") }}', null, form).then(data => {
                    if (data['success']) {
                        alert(`Poprawnie zmieniono hasło`);
                        window.location.reload();
                    } else {
                        alert(`Err: ${data['message']}`);
                    }
                }).catch(err => alert(`Err: ${JSON.stringify(err)}`));
            });
        });
    </script>
</body>
</html>
