{% extends "base.html" %}

{% block title %} Szczegóły Artykułu {% endblock %}

{% block body %}
    {% include 'toolbar.html' %}
    <div class="main-content">
        <div class="top-bar">
            <a href="{{ url_for('editor_articles.show_articles') }}" class="back-btn">Wróć do listy</a>
        </div>

        <h1>{{ article.title }}</h1>
        <p class="article-info"><strong>Autor:</strong> {{ article.author.get_nick() }}</p>
        <p class="article-info"><strong>Treść:</strong> {{ article_content|safe }}</p>

        <div class="action-buttons">
            <button class="accept-btn" onclick="acceptArticle()">Zaakceptuj</button>
            <button class="reject-btn" onclick="rejectArticle()">Odrzuć</button>
        </div>
    </div>

    <script>
        function acceptArticle() {
            fetch(`/editor/articles/{{ article.id }}/accept`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => response.json())
            .then(data => {
                alert(data.message);
                window.location.reload();
            })
            .catch(error => {
                alert('Failed to update status: ' + error.message);
                window.location.reload();
            });
        }

        function rejectArticle() {
            fetch(`/editor/articles/{{ article.id }}/reject`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => response.json())
            .then(data => {
                alert(data.message);
                window.location.reload();
            })
            .catch(error => {
                alert('Failed to reject article: ' + error.message);
                window.location.reload();
            });
        }
    </script>
{% endblock %}
