{% extends "base.html" %}

{% block title %} Szczegóły Artykułu {% endblock %}

{% block body %}
    {% include 'toolbar.html' %}

    <style>
        .main-content {
            padding: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .back-btn {
            padding: 10px 20px;
            background: #5a3d90;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: #4a1e87;
        }

        h1 {
            font-size: 28px;
            font-weight: bold;
            color: black;
            margin-bottom: 15px;
        }

        .article-info {
            font-size: 18px;
            color: #2d1053;
            margin-bottom: 10px;
        }

        .action-buttons {
            margin-top: 30px;
            display: flex;
            gap: 10px;
        }

        .action-buttons button {
            padding: 10px 20px;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .accept-btn {
            background: #5a3d90;
        }

        .accept-btn:hover {
            background: #4a1e87;
        }

        .reject-btn {
            background: #a8a8a8;
        }

        .reject-btn:hover {
            background: #8c8c8c;
        }
    </style>

    <div class="main-content">
        <div class="top-bar">
            <a href="{{ url_for('editor_articles.show_articles') }}" class="back-btn">Wróć do listy</a>
        </div>

        <h1>{{ article.title }}</h1>
        <p class="article-info"><strong>Autor:</strong> {{ article.author.get_nick }}</p>
        <p class="article-info"><strong>Treść:</strong> {{ article.content|safe }}</p>

        <div class="action-buttons">
            <button class="accept-btn" onclick="acceptArticle()">Zaakceptuj</button>
            <button class="reject-btn" onclick="rejectArticle()">Odrzuć</button>
        </div>
    </div>

    <script>
        function acceptArticle() {
            fetch(`/editor/articles/{{ article.id }}/accept`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => response.json())
            .then(data => {
                alert(data.message);
                window.location.reload();
            })
            .catch(error => {
                alert('Failed to update status: ' + error.message);
                window.location.reload();
            });
        }

        function rejectArticle() {
            alert('Article Rejected!');
            window.location.reload();
        }
    </script>
{% endblock %}
