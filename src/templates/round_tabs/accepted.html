<style>
    .reviewer-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #e0e0e0;
        padding: 5px 10px;
        margin-bottom: 5px;
        border-radius: 5px;
    }

    .reviewer-name {
        flex-grow: 1;
        display: flex;
        align-items: center;
    }

    .remove-reviewer {
        background: red;
        color: white;
        border: none;
        padding: 5px 10px;
        border-radius: 5px;
        cursor: pointer;
        transition: 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 30px;
    }

    .remove-reviewer:hover {
        background: darkred;
    }

    .reviewers-section {
        background: #f9f9f9;
        padding: 20px;
        border-radius: 10px;
        border: 1px solid #ddd;
        margin-top: 30px;
    }

    .reviewers-section h2, .reviewers-section h3 {
        color: #2d1053;
        margin-bottom: 10px;
    }

    .reviewers-section label {
        display: block;
        margin: 10px 0 5px;
        font-weight: bold;
    }

    .reviewers-section input[type="text"],
    .reviewers-section input[type="datetime-local"] {
        padding: 6px 10px;
        border-radius: 5px;
        border: 1px solid #ccc;
        box-sizing: border-box;
        font-size: 14px;
        width: 100%;
        max-width: 400px; /* Możesz dostosować szerokość */
        margin-bottom: 10px;
    }

    .reviewers-section input[type="text"] {
        color: rgba(0, 0, 0, 0.5);
        font-style: italic;
    }

    .reviewers-section input[type="text"]::placeholder {
        font-style: italic;
    }

    .reviewers-section button {
        background: #5a3d90;
        color: white;
        padding: 8px 16px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: 0.3s;
    }

    .reviewers-section button:hover {
        background: #4a1e87;
    }

    #assignedReviewers {
        list-style: none;
        padding: 0;
        margin-top: 5px;
    }

    .deadline-row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 15px;
    }

    .deadline-row > div {
        flex: 1;
        min-width: 200px;
    }
</style>

<div class="reviewers-section">
    <h2>Przypisz recenzentów</h2>
    <form action="/editor/articles/{{ article.id }}/assign_reviewers" method="post" onsubmit="return validateForm()">
        <label for="reviewer">Wybierz recenzenta:</label>
        <input list="reviewers" id="reviewer" name="reviewer" autocomplete="off" placeholder="Wpisz lub wybierz recenzenta">
        <datalist id="reviewers">
            {% for reviewer_id, reviewer_nick in reviewers.items() %}
                <option data-id="{{ reviewer_id }}" value="{{ reviewer_nick }}"></option>
            {% endfor %}
        </datalist>
        <button type="button" id="addReviewer">Dodaj recenzenta</button>

        <label for="reviewer">Zaproś do recenzowania przez email:</label>
        <button type="button" id="inviteReviewer">Zaproś</button>

        <div id="inviteForm" style="display: none; margin-top: 10px;" class="hidden">
            <label for="inviteEmail">Email recenzenta:</label>
            <input type="email" id="inviteEmail" name="inviteEmail" placeholder="Podaj email">
            <button type="button" id="addEmail">Dodaj email</button>
        </div>

        <h3>Przypisani recenzenci:</h3>
        <ul id="assignedReviewers"><li id="noReviewers">Nie przypisano recenzentów</li></ul>

        <h3>Lista zapraszanych emaili:</h3>
        <ul id="invitedEmails"><li id="noEmails">Nie podano emaili</li></ul>

        <div class="deadline-row">
            <div>
                <label for="deadline_confirm">Deadline potwierdzenia:</label>
                <input type="datetime-local" id="deadline_confirm" name="deadline_confirm" required>
            </div>
            <div>
                <label for="deadline_submit">Deadline oddania recenzji:</label>
                <input type="datetime-local" id="deadline_submit" name="deadline_submit" required>
            </div>
        </div>

        <button type="submit">Zapisz</button>
    </form>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const reviewerInput = document.getElementById("reviewer");
        const reviewerDatalist = document.getElementById("reviewers");
        const assignedReviewersList = document.getElementById("assignedReviewers");
        const noReviewersItem = document.getElementById("noReviewers");
        const form = document.querySelector("form");

        document.getElementById('addReviewer').addEventListener('click', function () {
            const enteredReviewer = reviewerInput.value.trim();
            let selectedReviewerId = null;

            // Sprawdzenie, czy wpisany tekst pasuje do dostępnych opcji
            for (let option of reviewerDatalist.options) {
                if (option.value === enteredReviewer) {
                    selectedReviewerId = option.getAttribute("data-id");
                    break;
                }
            }

            // Jeśli nie znaleziono recenzenta, wyświetl komunikat
            if (!selectedReviewerId) {
                alert("Wybierz recenzenta z listy.");
                return;
            }

            // Sprawdzanie, czy recenzent już został dodany
            if ([...assignedReviewersList.children].some(li => li.dataset.id === selectedReviewerId)) {
                alert("Recenzent już został dodany.");
                return;
            }

            if (noReviewersItem) {
                noReviewersItem.remove();
            }

            // Dodanie recenzenta do listy
            const newReviewerItem = document.createElement("li");
            newReviewerItem.classList.add("reviewer-item");
            newReviewerItem.setAttribute("data-id", selectedReviewerId);

            const reviewerNameSpan = document.createElement("span");
            reviewerNameSpan.textContent = enteredReviewer;
            reviewerNameSpan.classList.add("reviewer-name");

            const removeButton = document.createElement("button");
            removeButton.textContent = "Usuń";
            removeButton.classList.add("remove-reviewer");
            removeButton.addEventListener("click", function () {
                newReviewerItem.remove();
                hiddenInput.remove();

                if (assignedReviewersList.children.length === 0) {
                    assignedReviewersList.appendChild(noReviewersItem);
                }
            });

            newReviewerItem.appendChild(reviewerNameSpan);
            newReviewerItem.appendChild(removeButton);
            assignedReviewersList.appendChild(newReviewerItem);

            const hiddenInput = document.createElement("input");
            hiddenInput.type = "hidden";
            hiddenInput.name = "assigned_reviewers[]";
            hiddenInput.value = selectedReviewerId;
            form.appendChild(hiddenInput);

            reviewerInput.value = "";  // Resetowanie wartości po dodaniu recenzenta
        });

        document.getElementById('addEmail').addEventListener("click", function () {
            const email = document.getElementById("inviteEmail").value.trim();
            const emailList = document.getElementById("invitedEmails");
            const noEmailsItem = document.getElementById("noEmails");

            if (!email || !validateEmail(email)) {
                alert("Wprowadź poprawny adres email.");
                return;
            }

            // Sprawdzenie, czy email już jest dodany
            if ([...emailList.children].some(li => li.dataset.email === email)) {
                alert("Ten email został już dodany.");
                return;
            }

            if (noEmailsItem) {
                noEmailsItem.remove();
            }

            const newEmailItem = document.createElement("li");
            newEmailItem.classList.add("reviewer-item");
            newEmailItem.setAttribute("data-email", email);

            const emailSpan = document.createElement("span");
            emailSpan.textContent = email;
            emailSpan.classList.add("reviewer-name");

            const removeButton = document.createElement("button");
            removeButton.textContent = "Usuń";
            removeButton.classList.add("remove-reviewer");
            removeButton.addEventListener("click", function () {
                newEmailItem.remove();
                hiddenEmailInput.remove();

                if (emailList.children.length === 0) {
                    emailList.appendChild(noEmailsItem);
                }
            });

            newEmailItem.appendChild(emailSpan);
            newEmailItem.appendChild(removeButton);
            emailList.appendChild(newEmailItem);

            const hiddenEmailInput = document.createElement("input");
            hiddenEmailInput.type = "hidden";
            hiddenEmailInput.name = "invited_emails[]";
            hiddenEmailInput.value = email;
            form.appendChild(hiddenEmailInput);

            document.getElementById("inviteEmail").value = "";
            inviteForm.style.display = "none";
        });

        document.getElementById('inviteReviewer').addEventListener('click', function () {
            const inviteForm = document.getElementById("inviteForm");
            inviteForm.style.display = inviteForm.style.display === "none" ? "block" : "none";
        });

        function validateForm() {
            const assignedReviewers = document.querySelectorAll('input[name="assigned_reviewers[]"]');
            const invitedEmails = document.querySelectorAll('input[name="invited_emails[]"]');
            if (assignedReviewers.length === 0 && invitedEmails.length === 0) {
                alert("Musisz dodać co najmniej jednego recenzenta lub zaprosić przez email.");
                return false;
            }
            return true;
        }
        
        function validateEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email.toLowerCase());
        }

        function setMinDate() {
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            tomorrow.setHours(0, 0, 0, 0);

            const minDate = tomorrow.toISOString().slice(0, 16); // Format 'YYYY-MM-DDTHH:mm'
            document.getElementById("deadline_confirm").min = minDate;
            document.getElementById("deadline_submit").min = minDate;
        }

        setMinDate();
    });
</script>
