<link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.css" rel="stylesheet" />
<style>
.reviewers-section {
  padding: 1.5rem;
  background-color: white;
  margin: 0 auto;
  border: 1px solid #ddd;
}

.reviewers-section h2,
.reviewers-section h3 {
  margin-bottom: 1rem;
  color: #333;
}

label {
  display: block;
  margin-top: 1rem;
  margin-bottom: 0.5rem;
  font-weight: bold;
  color: #444;
}

.ts-control {
  border-radius: 6px !important;
  border: 1px solid #ccc !important;
  font-size: 1rem !important;
  padding: 0.5rem !important;
  box-sizing: border-box;
  width: 100% !important;
  background-color: white;
}

input[type="text"],
input[type="email"] {
  width: 100%;
  padding: 0.5rem;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 1rem;
  box-sizing: border-box;
}

input[type="datetime-local"] {
  background-color: #fffefc;
  border: 1px solid #ccc;
  border-radius: 6px;
  padding: 0.5rem 0.75rem;
  font-size: 1rem;
  font-family: inherit;
  width: 280px;
  max-width: 100%;
  box-sizing: border-box;
  transition: border-color 0.3s ease, box-shadow 0.3s ease;
}

input[type="datetime-local"]:focus {
  border-color: #5a3d90;
  outline: none;
}

button {
  margin-top: 0.5rem;
  padding: 0.5rem 1rem;
  font-size: 1rem;
  background-color: #5a3d90;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  transition: background-color 0.3s;
}

button:hover {
  background-color: #4a2a70;
}

ul {
  list-style-type: none;
  padding: 0;
}

.reviewer-item {
  background-color: #eee;
  padding: 0.5rem;
  margin-bottom: 0.5rem;
  border-radius: 6px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.remove-reviewer {
  background-color: #d9534f;
  margin-top: 0 !important;
  margin-left: 1rem;
  border: none;
  padding: 0.25rem 0.5rem;
  border-radius: 6px;
  color: white;
  cursor: pointer;
  font-size: 0.9rem;
  transition: background-color 0.3s;
}

.remove-reviewer:hover {
  background-color: #c9302c;
}

.deadline-row {
  display: flex;
  flex-direction: column;
  gap: 1rem;
  margin-top: 1rem;
}

.hidden {
  display: none;
}

.ts-placeholder {
  color: #999 !important;
  font-style: italic;
}

.link-button {
  background: none;
  border: none;
  color: #5a3d90;
  text-decoration: underline;
  cursor: pointer;
  padding: 0;
  font-size: 1rem;
}

.link-button:hover {
  background: none;
  border: none;
  color: #4a2a70;
}

#inviteForm {
  padding: 1rem;
  background-color: #f4f4f9;
  border-radius: 8px;
  border: 1px solid #ddd;
  box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
}

#inviteForm input {
  margin-bottom: 1rem;
}

/* Wyróżnienie sekcji z recenzentami i zaproszonymi mailami */
#assignedReviewers, #invitedEmails {
  background-color: #f9f9f9;  /* Jaśniejsze tło dla tych sekcji */
  padding: 1rem;
  border-radius: 6px;
  border: 1px solid #ccc;
  box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.1);  /* Cień dla sekcji */
}

#assignedReviewers li, #invitedEmails li {
  padding: 0.5rem;
  border-bottom: 1px solid #e5e5e5;
}

#assignedReviewers li:last-child, #invitedEmails li:last-child {
  border-bottom: none;
}

#assignedReviewers li span, #invitedEmails li span {
  font-weight: bold;
  color: #444;
}

#assignedReviewers li button, #invitedEmails li button {
  background-color: #5a3d90;
  color: white;
  border-radius: 6px;
  padding: 0.25rem 0.5rem;
  font-size: 0.9rem;
  cursor: pointer;
  transition: background-color 0.3s;
  margin-left: 1rem;
}

#assignedReviewers li button:hover, #invitedEmails li button:hover {
  background-color: #4a2a70;
}
</style>

<div class="reviewers-section">
  <h2>Przypisz recenzentów</h2>
  <form action="/editor/articles/{{ article.id }}/assign_reviewers" method="post" onsubmit="return validateForm()">
    <input type="hidden" name="tz" value="">
    <label>{{ lang_pkg.SelectQuestionSet.value }}</label>
    <select name="question_group_input">
        <option value="" selected>--{{ lang_pkg.QuestionGroup.value }}--</option>
        {% for qg in question_groups %}
            <option data-id="{{ qg.id }}">{{ qg.name }}</option>
        {% endfor %}
    </select><button type="button" id="add-question-group-btn" class="secondary-btn">{{ lang_pkg.AddQuestionGroup.value }}</button>
    <label for="reviewer">Wybierz recenzenta:</label>
    <select id="reviewer" name="reviewer" placeholder="Wybierz recenzenta...">
      <option value="" disabled selected> Wybierz recenzenta... </option>
      {% for reviewer_id, reviewer_nick in reviewers.items() %}
        <option value="{{ reviewer_id }}">{{ reviewer_nick }}</option>
      {% endfor %}
    </select>
    <button type="button" id="addReviewer">Dodaj recenzenta</button>
    <button type="button" id="inviteReviewer" class="link-button">lub zaproś przez email</button>
    <div id="inviteForm" class="hidden" style="margin-top: 10px;">
      <label for="inviteReviewer">Zaproś do recenzowania przez email:</label>
      <label for="inviteEmail">Email recenzenta:</label>
      <input type="email" id="inviteEmail" name="inviteEmail" placeholder="Podaj email" />
      <button type="button" id="addEmail">Dodaj email</button>
    </div>
    <h3>Przypisani recenzenci:</h3>
    <ul id="assignedReviewers"><li id="noReviewers">Nie przypisano recenzentów</li></ul>
    <h3>Lista zapraszanych emaili:</h3>
    <ul id="invitedEmails"><li id="noEmails">Nie podano emaili</li></ul>
    <div class="deadline-row">
      <div>
        <label for="deadline_confirm">Deadline potwierdzenia:</label>
        <input type="datetime-local" id="deadline_confirm" name="deadline_confirm" required />
      </div>
      <div>
        <label for="deadline_submit">Deadline oddania recenzji:</label>
        <input type="datetime-local" id="deadline_submit" name="deadline_submit" required />
      </div>
    </div>
    <button type="submit">Zapisz</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  document.getElementsByName('tz')[0].value=Intl.DateTimeFormat().resolvedOptions().timeZone;
  (function(){
    let form=document.getElementById('assign-form');
    let ul=document.getElementById('question-group-list');
    let question_group_input=form['question_group_input'];
    let add_question_btn=document.getElementById('add-question-group-btn');
    let values_dict={};
    add_question_btn.addEventListener('click', ()=>{
      let option=question_group_input.selectedOptions[0];
      if(option.value=='') {
        alert('{{ lang_pkg.QuestionGroupIsEmpty.value }}');
        return;
      }
      let option_id=option.dataset['id'];
      if(option_id in values_dict) {
        alert('{{ lang_pkg.QuestionGroupDuplicate.value }}');
        return;
      }
      values_dict[option_id]=true;
      let li=document.createElement('li');
      let inp=document.createElement('input');
      inp.type='hidden'; inp.name='question_group'; inp.value=option_id;
      let span=document.createElement('span');
      span.innerText=option.value;
      option.parentElement.removeChild(option)
      li.appendChild(inp);
      li.appendChild(span);
      ul.appendChild(li);
    }, false);
  })();
  new TomSelect("#questionSet", {
    create: false,
    maxItems: 1,
    allowEmptyOption: true,
    placeholder: "Wybierz zestaw pytań",
    onChange: function() { this.blur(); },
    onFocus: function() { this.clear(); }
  });
  const tsReviewer = new TomSelect("#reviewer", {
    create: false,
    maxItems: 1,
    allowEmptyOption: true,
    placeholder: "Wybierz recenzenta...",
    onChange: function() { this.blur(); },
    onFocus: function() { this.clear(); }
  });
  const reviewerSelect = document.getElementById("reviewer");
  const assignedReviewersList = document.getElementById("assignedReviewers");
  let noReviewersItem = document.getElementById("noReviewers");
  const form = document.querySelector("form");
  document.getElementById('addReviewer').addEventListener('click', function () {
    const selectedOption = reviewerSelect.options[reviewerSelect.selectedIndex];
    const selectedId = selectedOption.value;
    const selectedText = selectedOption.textContent;
    if (!selectedId) {
      alert("Wybierz recenzenta z listy.");
      return;
    }
    if ([...assignedReviewersList.children].some(li => li.dataset.id === selectedId)) {
      alert("Recenzent już został dodany.");
      return;
    }
    if (noReviewersItem) {
      noReviewersItem.remove();
      noReviewersItem = null;
    }
    const newReviewerItem = document.createElement("li");
    newReviewerItem.classList.add("reviewer-item");
    newReviewerItem.setAttribute("data-id", selectedId);
    const reviewerNameSpan = document.createElement("span");
    reviewerNameSpan.textContent = selectedText;
    const removeButton = document.createElement("button");
    removeButton.textContent = "Usuń";
    removeButton.classList.add("remove-reviewer");
    removeButton.addEventListener("click", function () {
      newReviewerItem.remove();
      hiddenInput.remove();
      if (assignedReviewersList.children.length === 0) {
        if (!noReviewersItem) {
          noReviewersItem = document.createElement("li");
          noReviewersItem.id = "noReviewers";
          noReviewersItem.textContent = "Nie przypisano recenzentów";
          assignedReviewersList.appendChild(noReviewersItem);
        }
      }
    });
    newReviewerItem.appendChild(reviewerNameSpan);
    newReviewerItem.appendChild(removeButton);
    assignedReviewersList.appendChild(newReviewerItem);
    const hiddenInput = document.createElement("input");
    hiddenInput.type = "hidden";
    hiddenInput.name = "assigned_reviewers[]";
    hiddenInput.value = selectedId;
    form.appendChild(hiddenInput);
    tsReviewer.clear();
  });
  const emailInput = document.getElementById("inviteEmail");
  const emailList = document.getElementById("invitedEmails");
  let noEmailsItem = document.getElementById("noEmails");
  document.getElementById('addEmail').addEventListener('click', function () {
    const email = emailInput.value.trim();
    if (!email || !validateEmail(email)) {
      alert("Wprowadź poprawny adres email.");
      return;
    }
    if ([...emailList.children].some(li => li.dataset.email === email)) {
      alert("Ten email został już dodany.");
      return;
    }
    if (noEmailsItem) {
      noEmailsItem.remove();
      noEmailsItem = null;
    }
    const newEmailItem = document.createElement("li");
    newEmailItem.classList.add("reviewer-item");
    newEmailItem.setAttribute("data-email", email);
    const emailSpan = document.createElement("span");
    emailSpan.textContent = email;
    const removeButton = document.createElement("button");
    removeButton.textContent = "Usuń";
    removeButton.classList.add("remove-reviewer");
    removeButton.addEventListener("click", function () {
      newEmailItem.remove();
      hiddenEmailInput.remove();
      if (emailList.children.length === 0) {
        if (!noEmailsItem) {
          noEmailsItem = document.createElement("li");
          noEmailsItem.id = "noEmails";
          noEmailsItem.textContent = "Nie podano emaili";
          emailList.appendChild(noEmailsItem);
        }
      }
    });
    newEmailItem.appendChild(emailSpan);
    newEmailItem.appendChild(removeButton);
    emailList.appendChild(newEmailItem);
    const hiddenEmailInput = document.createElement("input");
    hiddenEmailInput.type = "hidden";
    hiddenEmailInput.name = "invited_emails[]";
    hiddenEmailInput.value = email;
    form.appendChild(hiddenEmailInput);
    emailInput.value = "";
    document.getElementById("inviteForm").style.display = "none";
  });
  document.getElementById('inviteReviewer').addEventListener('click', function () {
    const inviteForm = document.getElementById("inviteForm");
    inviteForm.style.display = inviteForm.style.display === "none" ? "block" : "none";
  });
  function validateForm() {
    const assignedReviewers = document.querySelectorAll('input[name="assigned_reviewers[]"]');
    const invitedEmails = document.querySelectorAll('input[name="invited_emails[]"]');
    if (assignedReviewers.length === 0 && invitedEmails.length === 0) {
      alert("Musisz dodać co najmniej jednego recenzenta lub zaprosić przez email.");
      return false;
    }
    return true;
  }
  function validateEmail(email) {
    const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    return re.test(email.toLowerCase());
  }
  function setMinDate() {
    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    tomorrow.setHours(0, 0, 0, 0);
    const minDate = tomorrow.toISOString().slice(0, 16);
    document.getElementById("deadline_confirm").min = minDate;
    document.getElementById("deadline_submit").min = minDate;
  }
  setMinDate();
});
</script>
