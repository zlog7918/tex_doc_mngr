{% extends "base.html" %}

{% block title %} {{ lang_pkg.OptionList.value }} {% endblock %}

{% block body %}
    {% include 'toolbar.html' %}

    <style>
        .main-content {
            padding: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        h1 {
            font-size: 32px;
            font-weight: bold;
            color: black;
            margin-bottom: 20px;
        }

        .above-table-text {
            text-align: left;
            font-size: 18px;
            color: #2d1053;
            margin-bottom: 10px;
        }

        table {
            width: 100%; 
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.1);
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #5a3d90;
            color: white;
            font-weight: 600;
        }

        tr:hover {
            background: #f3f1f9;
        }

        .details-btn {
            background: #5a3d90;
            color: white;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 5px;
            font-size: 14px;
            transition: 0.3s;
        }

        .details-btn:hover {
            background: #4a1e87;
        }

    </style>

    <div class="main-content">
        <h1>{{ lang_pkg.OptionList.value }}</h1>
        <ul>
            <li><a href="{{ url_with_lang_for('question.show_questions') }}" class="details-btn">{{ lang_pkg.QuestionList.value }}</a></li>
            <li><a href="{{ url_with_lang_for('question.show_question_groups') }}" class="details-btn">{{ lang_pkg.QuestionGroupList.value }}</a></li>
        </ul>
        <td></td>
    </div>

{% endblock %}
