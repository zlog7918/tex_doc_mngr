<!DOCTYPE html>
<html>
<head>
    <title>Review Questions</title>
</head>
<body>
    <h1>Answer Questions</h1>
    <form method="POST" action="/reviews/{{ review_id }}/submit_review">
        {% for question in questions %}
            <label>{{ question["text"] }}</label><br>
            {% if question["is_abc"] %}
                {% for option in question["answers"] %}
                    <input type="radio" id="option_{{ question['group_id'] }}_{{ question['id'] }}_{{ option['id'] }}" name="question_{{ question['group_id'] }}_{{ question['id'] }}" value="{{ option['answer'] }}" required>
                    <label for="option_{{ question['group_id'] }}_{{ question['id'] }}_{{ option['id'] }}">{{ option["answer"] }}</label><br>
                {% endfor %}
            {% else %}
                <input type="text" name="question_{{ question['group_id'] }}_{{ question['id'] }}" required><br>
            {% endif %}
        {% endfor %}
        <button type="submit">Submit</button>
    </form>
</body>
</html>
