{% extends "base.html" %}

{% block title %} Szczegóły Artykułu {% endblock %}

{% block body %}
    {% include 'toolbar.html' %}

    <style>
        .main-content {
            padding: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .back-btn {
            padding: 10px 20px;
            background: #5a3d90;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: #4a1e87;
        }

        h1 {
            font-size: 28px;
            font-weight: bold;
            color: black;
            margin-bottom: 15px;
        }

        .article-info {
            font-size: 18px;
            color: #2d1053;
            margin-bottom: 10px;
        }

        .action-buttons {
            margin-top: 30px;
            display: flex;
            gap: 10px;
        }

        .action-buttons button {
            padding: 10px 20px;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .accept-btn {
            background: #5a3d90;
        }

        .accept-btn:hover {
            background: #4a1e87;
        }

        .reject-btn {
            background: #a8a8a8;
        }

        .reject-btn:hover {
            background: #8c8c8c;
        }

        .article-embed {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
            overflow: hidden;
        }

        .article-embed iframe,
        .article-embed embed,
        .article-embed object {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>

    <div class="main-content">
        <div class="top-bar">
            <a href="{{ url_for('review.list_reviewer_reviews') }}" class="back-btn">Wróć do listy</a>
        </div>

        <h1>{{ article.title }}</h1>
        <p class="article-info"><strong>Autor:</strong> {{ article.author.get_nick() }}</p>
        <p class="article-embed"><strong>Treść:</strong> {{ article_content|safe }}</p>

        <div class="action-buttons">
            <button class="accept-btn" onclick="acceptArticle()">Zaakceptuj</button>
            <button class="reject-btn" onclick="rejectArticle()">Odrzuć</button>
        </div>
    </div>

    <script>
        function acceptArticle() {
            fetch(`/reviews/{{ review_id }}/accept`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
                if (response.ok) {
                    return response.json();
                } else {
                    return response.json().then(data => {
                        throw new Error(data.error || 'Unknown error occurred');
                    });
                }
            })
            .then(data => {
                alert(data['message']);
                window.location.reload();

            })
            .catch(error => {
                alert('Failed to update status: ' + error.message);
            });
        }
        function rejectArticle() {
            fetch(`/reviews/{{ review_id }}/reject`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
                if (response.ok) {
                    return response.json();
                } else {
                    return response.json().then(data => {
                        throw new Error(data.error || 'Unknown error occurred');
                    });
                }
            })
            .then(data => {
                alert(data['message']);
                window.location.reload();

            })
            .catch(error => {
                alert('Failed to update status: ' + error.message);
            });
        }
    </script>

{% endblock %}
