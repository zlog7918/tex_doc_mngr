<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Correction</title>
</head>
<body>
    <h1>LaTeX to PDF Converter</h1>

    <form id="uploadForm" enctype="multipart/form-data">
        <h2>{{ article.title }}</h1>
        <label for="file">Choose a LaTeX file (.tex):</label>
        <input type="file" name="file" id="file" multiple required>
        <div id="mainTexSelector" style="display: none;">
            <label for="mainTex">Wybierz główny plik .tex:</label>
            <select id="mainTex" name="mainTex"></select>
        </div>
        <br><br>


        <button type="button" id="previewBtn" style="display: none;">View PDF</button>


        <button type="submit" id="sendBtn" style="display: none;">Send</button>
    </form>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            let fileInput = document.getElementById('file');
            let title = document.querySelector('#uploadForm input[name="title"]');
            let editor = document.querySelector('#uploadForm input[name="editor"]');
            let previewBtn = document.getElementById('previewBtn');
            let sendBtn = document.getElementById('sendBtn');
            let uploadForm = document.getElementById('uploadForm');
            let mainTexDiv = document.getElementById('mainTexSelector');
            let mainTexSelect = document.getElementById('mainTex');

            fileInput.addEventListener('change', function() {
                let showButtons = this.files.length > 0;
                previewBtn.style.display = showButtons ? "inline-block" : "none";
                sendBtn.style.display = showButtons ? "inline-block" : "none";
            });

            previewBtn.addEventListener("click", async function() {
                let formData = new FormData();
                for (const file of fileInput.files)
                    formData.append("files", file);
                if (mainTexDiv.style.display !== "none" && mainTexSelect.value)
                    formData.append("mainTex", mainTexSelect.value);

                let response = await fetch("/articles/generate-preview", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();

                if (data.data?.need_main_tex && data.data?.tex_files) {
                    mainTexSelect.innerHTML = '';
                    data.data.tex_files.forEach(file => {
                        const option = document.createElement('option');
                        option.value = file;
                        option.textContent = file;
                        mainTexSelect.appendChild(option);
                    });
                    mainTexDiv.style.display = 'block';
                    mainTexSelect.required = true;
                    alert("📝 Wybierz główny plik .tex z listy i kliknij ponownie 'View PDF'.");
                } else if (data.data?.pdf_url) {
                    window.open(data.data.pdf_url, '_blank');
                } else {
                    alert("❌ Błąd generowania podglądu: " + (data.message || "Nieznany błąd"));
                }
            });

            // Obsługa zapisu pliku
            uploadForm.addEventListener("submit", async function (event) {
                event.preventDefault();
                const formData = new FormData();
                for (const file of fileInput.files) {
                    formData.append("files", file);
                }
                // Dodaj wybrany plik mainTex
                if (mainTexDiv.style.display !== "none" && mainTexSelect.value) {
                    formData.append("mainTex", mainTexSelect.value);
                }

                try {
                    let response = await fetch("/articles/{{ article.id }}/upload-correction", {
                        method: "POST",
                        body: formData
                    });

                    const data = await response.json();

                    // Jeśli backend prosi o wybór głównego pliku
                    if (data.data?.need_main_tex && data.data?.tex_files) {
                        mainTexSelect.innerHTML = '';
                        data.data.tex_files.forEach(file => {
                            const option = document.createElement('option');
                            option.value = file;
                            option.textContent = file;
                            mainTexSelect.appendChild(option);
                        });
                        mainTexDiv.style.display = 'block';
                        mainTexSelect.required = true;

                        alert("📝 Wybierz główny plik .tex z listy i kliknij ponownie 'Send'.");
                        return;
                    }

                    // Przesłano i wygenerowano PDF
                    if (!data.data?.need_main_tex && data.data?.pdf_url) {
                        alert("✅ Plik przesłany pomyślnie!");
                        window.location.href = window.location.href;
                    } else {
                        alert("❌ Błąd przesyłania: " + (data.message || "Nieznany błąd"));
                    }

                } catch (error) {
                    alert("🚨 Błąd podczas przesyłania: " + error.message);
                }
            });
        });
    </script>
</body>
</html>
