<style>
    .article-embed {
    position: relative;
    padding-bottom: 56.25%; /* 16:9 */
    height: 0;
    overflow: hidden;
    }

    .article-embed iframe,
    .article-embed embed,
    .article-embed object {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: 0;
    }
</style>


<p class="article-embed"><strong>Treść:</strong> {{ article_content|safe }}</p>
