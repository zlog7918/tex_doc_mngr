{% extends "base.html" %}

{% block title %}Dodaj Artykuł{% endblock %}

{% block body %}
    {% include 'toolbar.html' %}

    <style>
        .main-content {
            padding: 30px;
            width: 100%;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            border-radius: 10px;
        }

        h1 {
            font-size: 36px;
            font-weight: bold;
            color: #2d1053;
            margin-bottom: 20px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            font-size: 18px;
            color: #2d1053;
            display: block;
            margin-bottom: 8px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .form-actions {
            text-align: center;
            margin-top: 20px;
        }

        .btn {
            background: #5a3d90;
            color: white;
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
            margin: 0 10px;
        }

        .btn:hover {
            background: #4a1e87;
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        @media (max-width: 768px) {
            .main-content {
                padding: 15px;
            }

            .form-group {
                margin-bottom: 15px;
            }

            h1 {
                font-size: 28px;
            }

            .btn {
                padding: 10px 20px;
            }
        }
    </style>

    <div class="main-content">
        <h1>Dodaj Artykuł</h1>

        <form id="uploadForm" enctype="multipart/form-data" class="upload-form">
            <div class="form-group">
                <label for="file">Wybierz plik LaTeX (.tex):</label>
                <input type="file" name="file" id="file" accept=".tex" required>
            </div>

            <div class="form-group">
                <label for="title">Tytuł:</label>
                <input type="text" name="title" id="title" required>
            </div>

            <div class="form-group">
                <label for="editor">Edytor:</label>
                <select id="editor" name="editor" required>
                    <option value="" disabled selected>Wybierz edytora</option>
                    {% for editor_id, editor_nick in editors.items() %}
                        <option value="{{ editor_id }}">{{ editor_nick }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-actions">
                <button type="button" id="previewBtn" class="btn" style="display: none;">Podgląd PDF</button>
                <button type="submit" id="sendBtn" class="btn" style="display: none;">Wyślij</button>
            </div>
        </form>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            let fileInput = document.getElementById('file');
            let title = document.querySelector('#uploadForm input[name="title"]');
            let editor = document.getElementById("editor");
            let previewBtn = document.getElementById('previewBtn');
            let sendBtn = document.getElementById('sendBtn');
            let uploadForm = document.getElementById('uploadForm');

            fileInput.addEventListener('change', function() {
                let filename = this.files[0]?.name || "";
                if (filename.endsWith('.tex')) {
                    previewBtn.style.display = "inline-block";
                    sendBtn.style.display = "inline-block";
                } else {
                    previewBtn.style.display = "none";
                    sendBtn.style.display = "none";
                }
            });

            previewBtn.addEventListener("click", async function() {
                let formData = new FormData();
                formData.append("file", fileInput.files[0]);

                let response = await fetch("/articles/generate-preview", {
                    method: "POST",
                    body: formData
                });

                let data = await response.json();

                if (data.pdf_url) {
                    window.open(data.pdf_url, '_blank');
                } else {
                    alert("Błąd: " + (data.error || "Nie udało się wygenerować podglądu"));
                }
            });

            uploadForm.addEventListener("submit", async function(event) {
                event.preventDefault();

                let editorId = editor.value;
                if (!editorId) {
                    alert("Proszę wybrać edytora.");
                    return;
                }

                let formData = new FormData();
                formData.append("file", fileInput.files[0]);
                formData.append("title", title.value);
                formData.append("editor", editorId);

                let response = await fetch("/articles/upload", {
                    method: "POST",
                    body: formData
                });

                let data = await response.json();

                if (data['message']) {
                    alert("Plik został pomyślnie załadowany!");
                    window.location.reload();
                } else {
                    alert("Wystąpił problem: " + (data.error || "Nieznany błąd"));
                }
            });
        });
    </script>
{% endblock %}
