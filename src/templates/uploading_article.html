<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Article</title>
</head>
<body>
    <h1>LaTeX to PDF Converter</h1>

    <form id="uploadForm" enctype="multipart/form-data">
        <label for="file">Choose a LaTeX file (.tex):</label>
        <input type="file" name="files" id="file"
               accept=".tex,.zip,.tar,.gz,.bz2,.xz,.tgz,.tbz2"
               multiple required><br>
        Tytuł: <input type="text" name="title" required><br>
        Edytor: <input type="text" name="editor" required>
        <br><br>


        <button type="button" id="previewBtn" style="display: none;">View PDF</button>


        <button type="submit" id="sendBtn" style="display: none;">Send</button>
    </form>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            let fileInput = document.getElementById('file');
            let title = document.querySelector('#uploadForm input[name="title"]');
            let editor = document.querySelector('#uploadForm input[name="editor"]');
            let previewBtn = document.getElementById('previewBtn');
            let sendBtn = document.getElementById('sendBtn');
            let uploadForm = document.getElementById('uploadForm');

            // Po wybraniu pliku pokaż przyciski
            const allowedExtensions = ['.tex', '.zip', '.tar', '.gz', '.bz2', '.xz', '.tgz', '.tbz2'];

            fileInput.addEventListener('change', function() {
                const files = this.files;
                let showButtons = false;

                for (let i = 0; i < files.length; i++) {
                    const filename = files[i].name.toLowerCase();
                    if (allowedExtensions.some(ext => filename.endsWith(ext))) {
                        showButtons = true;
                        break;
                    }
                }

                previewBtn.style.display = showButtons ? "inline-block" : "none";
                sendBtn.style.display = showButtons ? "inline-block" : "none";
            });

            // Obsługa podglądu PDF
            previewBtn.addEventListener("click", async function() {
                let formData = new FormData();
                for (const file of fileInput.files) {
                    formData.append("files", file);
                }
                try {
                    let response = await fetch("/articles/generate-preview", {
                        method: "POST",
                        body: formData
                    });

                    if (!response.ok) {
                        throw new Error(`Server error: ${response.status} ${response.statusText}`);
                    }

                    let data = await response.json();

                    if (data.pdf_url) {
                        window.open(data.pdf_url, '_blank');
                    } else {
                        alert("❌ Błąd generowania podglądu: " + (data.message || "Nieznany błąd"));
                    }
                } catch (error) {
                    alert("🚨 Błąd podczas generowania podglądu: " + error.message);
                }
            });

            // Obsługa zapisu pliku
            uploadForm.addEventListener("submit", async function(event) {
                event.preventDefault();
                let formData = new FormData();
                for (let i = 0; i < fileInput.files.length; i++) {
                    formData.append("files", fileInput.files[i]);
                }
                formData.append("title", title.value);
                formData.append("editor", editor.value);

                let response = await fetch("/articles/upload", {
                    method: "POST",
                    body: formData
                });

                let data = await response.json();

                if (data['message']) {
                    alert("File uploaded successfully!");
                } else {
                    alert("Upload failed: " + (data.error || "Unknown error"));
                }
            });
        });
    </script>
</body>
</html>
