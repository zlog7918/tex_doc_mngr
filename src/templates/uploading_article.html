<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Article</title>
</head>
<body>
    <h1>LaTeX to PDF Converter</h1>

    <form id="uploadForm" enctype="multipart/form-data">
        <label for="file">Wybierz pliki:</label>
        <input type="file" name="files" id="file" multiple required><br>

        Tytuł: <input type="text" name="title" required><br>

        Edytor:
        <select id="editor" name="editor" required>
            <option value="" disabled selected>Wybierz edytora</option>
            {% for editor_id, editor_nick in editors.items() %}
                <option value="{{ editor_id }}">{{ editor_nick }}</option>
            {% endfor %}
        </select><br><br>

        <div id="mainTexSelector" style="display: none;">
            <label for="mainTex">Wybierz główny plik .tex:</label>
            <select id="mainTex" name="mainTex" required></select>
        </div><br>

        <button type="button" id="previewBtn" style="display: none;">View PDF</button>
        <button type="submit" id="sendBtn" style="display: none;">Send</button>
    </form>

    <script>
    document.addEventListener("DOMContentLoaded", function () {
        const fileInput = document.getElementById('file');
        const title = document.querySelector('#uploadForm input[name="title"]');
        const editor = document.getElementById("editor");
        const previewBtn = document.getElementById('previewBtn');
        const sendBtn = document.getElementById('sendBtn');
        const uploadForm = document.getElementById('uploadForm');
        const mainTexDiv = document.getElementById('mainTexSelector');
        const mainTexSelect = document.getElementById('mainTex');

        fileInput.addEventListener('change', function () {
            const files = Array.from(this.files);
            const texFiles = files.filter(file => file.name.toLowerCase().endsWith('.tex'));

            const showButtons = files.length > 0;
            previewBtn.style.display = showButtons ? "inline-block" : "none";
            sendBtn.style.display = showButtons ? "inline-block" : "none";

            if (texFiles.length > 1) {
                mainTexSelect.innerHTML = '';
                texFiles.forEach(file => {
                    const option = document.createElement('option');
                    option.value = file.name;
                    option.textContent = file.name;
                    mainTexSelect.appendChild(option);
                });
                mainTexDiv.style.display = 'block';
                mainTexSelect.required = true;
            } else {
                mainTexDiv.style.display = 'none';
                mainTexSelect.required = false;

            }
        });
        // Obsługa podglądu
        previewBtn.addEventListener("click", async function () {
            const formData = new FormData();
            for (const file of fileInput.files) {
                formData.append("files", file);
            }

            // Dodaj wybrany plik mainTex
            if (mainTexDiv.style.display !== "none") {
                formData.append("mainTex", mainTexSelect.value);
            }

            try {
                const response = await fetch("/articles/generate-preview", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();

                if (data.need_main_tex && data.tex_files) {
                    mainTexSelect.innerHTML = '';
                    data.tex_files.forEach(file => {
                        const option = document.createElement('option');
                        option.value = file;
                        option.textContent = file;
                        mainTexSelect.appendChild(option);
                    });
                    mainTexDiv.style.display = 'block';
                    mainTexSelect.required = true;
                    alert("📝 Wybierz główny plik .tex z listy i kliknij ponownie 'View PDF'.");
                } else if (data.pdf_url) {
                    window.open(data.pdf_url, '_blank');
                } else {
                    alert("❌ Błąd generowania podglądu: " + (data.message || "Nieznany błąd"));
                }
            } catch (error) {
                alert("🚨 Błąd podczas generowania podglądu: " + error.message);
                console.error("[Preview ERROR]", error);
            }
        });

        // Obsługa zapisu pliku
        uploadForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const editorId = editor.value;
            if (!editorId) {
                alert("Proszę wybrać edytora.");
                return;
            }

            const formData = new FormData();
            for (const file of fileInput.files) {
                formData.append("files", file);
            }

            formData.append("title", title.value);
            formData.append("editor", editorId);

            // Dodaj wybrany plik mainTex
            if (mainTexDiv.style.display !== "none" && mainTexSelect.value) {
                formData.append("mainTex", mainTexSelect.value);
            }

            try {
                const response = await fetch("/articles/upload", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();

                // Jeśli backend prosi o wybór głównego pliku
                if (data.data?.need_main_tex && data.data?.tex_files) {
                    mainTexSelect.innerHTML = '';
                    data.data.tex_files.forEach(file => {
                        const option = document.createElement('option');
                        option.value = file;
                        option.textContent = file;
                        mainTexSelect.appendChild(option);
                    });
                    mainTexDiv.style.display = 'block';
                    mainTexSelect.required = true;

                    alert("📝 Wybierz główny plik .tex z listy i kliknij ponownie 'Send'.");
                    return;
                }

                // Przesłano i wygenerowano PDF
                if (!data.data?.need_main_tex && data.data?.pdf_url) {
                    alert("✅ Plik przesłany pomyślnie!");
                } else {
                    alert("❌ Błąd przesyłania: " + (data.error || "Nieznany błąd"));
                }

            } catch (error) {
                alert("🚨 Błąd podczas przesyłania: " + error.message);
            }
        });
    });
    </script>

</body>
</html>
