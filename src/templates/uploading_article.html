{% extends "base.html" %}

{% block title %} Dodaj Artykuł {% endblock %}

{% block body %}
    {% include 'toolbar.html' %}

    <style>
        .main-content {
            padding: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        h1 {
            font-size: 28px;
            font-weight: bold;
            color: black;
            margin-bottom: 15px;
        }

        .form-container {
            max-width: 800px;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
        }

        .form-container label {
            display: block;
            font-size: 16px;
            margin-top: 10px;
            color: #2d1053;
        }

        .form-container input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .action-buttons {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .action-buttons button {
            padding: 10px 20px;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .preview-btn {
            background: #5a3d90;
            display: none;
        }

        .preview-btn:hover {
            background: #4a1e87;
        }

        .send-btn {
            background: #28a745;
            display: none;
        }

        .send-btn:hover {
            background: #218838;
        }
    </style>

    <div class="main-content">
        <h1>Konwerter LaTeX do PDF</h1>

        <div class="form-container">
            <form id="uploadForm" enctype="multipart/form-data">
                <label for="file">Wybierz plik LaTeX (.tex):</label>
                <input type="file" name="file" id="file" accept=".tex" required>

                <label for="title">Tytuł:</label>
                <input type="text" name="title" required>

                <label for="editor">Edytor:</label>
                <input type="text" name="editor" required>

                <div class="action-buttons">
                    <button type="button" id="previewBtn" class="preview-btn">Podgląd PDF</button>
                    <button type="submit" id="sendBtn" class="send-btn">Wyślij</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            let fileInput = document.getElementById('file');
            let previewBtn = document.getElementById('previewBtn');
            let sendBtn = document.getElementById('sendBtn');
            let uploadForm = document.getElementById('uploadForm');

            fileInput.addEventListener('change', function() {
                let filename = this.files[0]?.name || "";
                if (filename.endsWith('.tex')) {
                    previewBtn.style.display = "inline-block";
                    sendBtn.style.display = "inline-block";
                } else {
                    previewBtn.style.display = "none";
                    sendBtn.style.display = "none";
                }
            });

            previewBtn.addEventListener("click", async function() {
                let formData = new FormData();
                formData.append("file", fileInput.files[0]);

                let response = await fetch("/editor/articles/generate-preview", {
                    method: "POST",
                    body: formData
                });

                let data = await response.json();

                if (data.pdf_url) {
                    window.open(data.pdf_url, '_blank');
                } else {
                    alert("Błąd: " + (data.error || "Nie udało się wygenerować podglądu"));
                }
            });

            uploadForm.addEventListener("submit", async function(event) {
                event.preventDefault();
                let formData = new FormData(uploadForm);

                let response = await fetch("/articles/upload", {
                    method: "POST",
                    body: formData
                });

                let data = await response.json();

                if (data['message']) {
                    alert("Plik został przesłany pomyślnie!");
                } else {
                    alert("Błąd przesyłania: " + (data.error || "Nieznany błąd"));
                }
            });
        });
    </script>

{% endblock %}
