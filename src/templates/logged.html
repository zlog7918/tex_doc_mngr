{% extends "base.html" %}

{% block body %}
    <div class="container">
        <h1>Cześć, zalogowałeś się</h1>

        <div class="actions">
            <button id="logout-btn" class="secondary-btn">Wyloguj</button>
            <button id="toggle-change-password" class="primary-btn">Zmień hasło</button>
        </div>

        <form id="change-password-form" class="hidden">
            <div class="form-group">
                <label>Stare hasło:</label>
                <input type="password" name="passwd" required>
            </div>

            <div class="form-group">
                <label>Nowe hasło:</label>
                <input type="password" name="new_passwd" required>
            </div>

            <div class="form-group">
                <label>Powtórz nowe hasło:</label>
                <input type="password" name="rep_passwd" required>
            </div>

            <button type="button" id="change-password-btn" class="primary-btn">Zmień hasło</button>
        </form>
    </div>

    <style>
        .container {
            text-align: center;
            padding: 20px;
            max-width: 400px;
            margin: auto;
        }

        .actions {
            margin: 20px 0;
        }

        .primary-btn, .secondary-btn {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .primary-btn {
            background: #5a3d90;
            color: white;
        }

        .secondary-btn {
            background: #2d1053;
            color: white;
        }

        .primary-btn:hover, .secondary-btn:hover {
            opacity: 0.9;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }

        .form-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 10px;
        }

        label {
            font-weight: bold;
        }

        input {
            width: 80%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-align: left;
        }

        .hidden {
            display: none;
        }
    </style>

    <script>
        document.getElementById("logout-btn").addEventListener("click", function () {
            ajax_json_call('/user/logout').then(response => {
                if (response.success)
                    window.location.reload();
                else
                    alert(`Err: ${response.message}`);
            }).catch(err => alert(`Err: ${JSON.stringify(err)}`));
        });

        document.getElementById("toggle-change-password").addEventListener("click", function () {
            let form = document.getElementById("change-password-form");
            form.classList.toggle("hidden");
        });

        document.getElementById("change-password-btn").addEventListener("click", function () {
            let form = document.getElementById("change-password-form");
            ajax_json_call('/user/ch_pass', null, form).then(data => {
                if ('error' in data) {
                    if (data['error']) {
                        alert(`Err: ${data['message']}`);
                    } else {
                        alert(`Poprawnie zmieniono hasło`);
                        window.location.reload();
                    }
                } else {
                    alert(`Err: ${JSON.stringify(data)}`);
                }
            }).catch(err => alert(`Err: ${JSON.stringify(err)}`));
        });
    </script>
{% endblock %}
