<!DOCTYPE html>
<html>
<head>
    <title>Review Form</title>
</head>
<body>
    <h1>Review Article</h1>
    <form method="POST">
        <label for="reviewer">Reviewer Name:</label>
        <input type="text" id="reviewer" name="reviewer" required><br>
        <label for="comments">Comments:</label>
        <textarea id="comments" name="comments" required></textarea><br>
        <label for="rating">Rating:</label>
        <select id="rating" name="rating" required>
            <option value="Fine as it is">Fine as it is</option>
            <option value="Requires small changes">Requires small changes</option>
            <option value="Needs major revisions">Needs major revisions</option>
            <option value="Rejected">Rejected</option>
        </select><br>
        <button type="submit">Submit Review</button>
    </form>
</body>
</html>
