<div>
    <h2>Assign Reviewers</h2>
    <form action="/articles/assign_reviewers/{{ article.id }}" method="post">
        <label for="reviewer">Select a reviewer:</label>
        <select id="reviewer" name="reviewer" required>
            {% for reviewer in reviewers %}
                <option value="{{ reviewer.id }}">{{ reviewer.nick }}</option>
            {% endfor %}
        </select>

        <label for="deadline_confirm">Confirmation Deadline:</label>
        <input type="datetime-local" id="deadline_confirm" name="deadline_confirm" required>

        <label for="deadline_submit">Submission Deadline:</label>
        <input type="datetime-local" id="deadline_submit" name="deadline_submit" required>

        <button type="submit">Add reviewer</button>
    </form>

    <h3>Assigned Reviewers:</h3>
    <ul>
        {% for reviewer in assigned_reviewers %}
            <li>{{ reviewer.nick }}</li>
        {% endfor %}
    </ul>
</div>
