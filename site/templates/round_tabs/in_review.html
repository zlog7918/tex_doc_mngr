<div>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f4f4f4;
        }
    </style>
    <table>
        <thead>
            <tr>
                <th>Reviewer</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            {% for review in reviews %}
                <tr>
                    <td>{{review.reviewer_id}}</td>
                    <td>{{review.status}}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
