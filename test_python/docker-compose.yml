services:
  test_python:
    build:
      context: ./test_python
      dockerfile: Dockerfile
      args:
        - APP_MAIN_DIR=${APP_MAIN_DIR}
    volumes:
      - ./src:${APP_MAIN_DIR}/app/src:ro
    env_file:
      - ./.env
      - ./.psql.env
      - ./.python.env
    runtime: "runsc"
volumes:
  doc_files:
