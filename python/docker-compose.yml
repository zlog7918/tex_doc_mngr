services:
  python:
    build:
      context: ./python
      dockerfile: Dockerfile
      args:
        - APP_MAIN_DIR=${APP_MAIN_DIR}
    volumes:
      - ./src:${APP_MAIN_DIR}/app/src:ro
      - doc_files:${DOC_FILES_DIR}:rw
    env_file:
      - ./.env
      - ./.psql.env
      - ./.python.env
    depends_on:
      - psql
    expose:
      - 5000
    runtime: "runsc"
volumes:
  doc_files:
